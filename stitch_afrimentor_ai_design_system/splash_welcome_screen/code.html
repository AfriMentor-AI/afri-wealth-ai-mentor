<!-- Interactive Micro-interaction Script -->
<script>
        function handleGetStarted() {
            // Subtle haptic feedback simulation
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(20);
            }
            
            const btn = event.currentTarget;
            btn.innerHTML = `
                <div class="flex items-center gap-md">
                    <svg class="animate-spin h-5 w-5 text-on-primary-container" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Preparing your path...
                </div>
            `;
            
            setTimeout(() => {
                btn.style.backgroundColor = '#1b6d24'; // secondary (green) for success
                btn.classList.remove('text-on-primary-container');
                btn.classList.add('text-on-secondary');
                btn.innerHTML = `
                    Ready to grow
                    <span class="material-symbols-outlined">check_circle</span>
                `;
            }, 1500);
        }

        // Parallax effect for the background motif
        window.addEventListener('mousemove', (e) => {
            const motif = document.querySelector('.sankofa-bg');
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            motif.style.transform = `translate(${x}px, ${y}px) rotate(-15deg)`;
        });
    </script>
