name: Review SLA

# Remind reviewers when a PR has had no review activity for 20 h (4 h buffer before
# the 24 h first-response SLA defined in CONTRIBUTING.md §5 / card D2.5).
# Runs every 4 hours; only fires on non-draft PRs targeting main or develop.

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:         # allow manual trigger for testing

permissions:
  pull-requests: write

jobs:
  sla-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check open PRs for review SLA breach
        uses: actions/github-script@v7
        with:
          script: |
            const SLA_HOURS = 20;          // warn at 20 h (SLA = 24 h)
            const SLA_MS    = SLA_HOURS * 60 * 60 * 1000;
            const now       = Date.now();

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: "open",
              per_page: 100,
            });

            for (const pr of prs) {
              // Skip drafts and PRs not targeting main/develop.
              if (pr.draft) continue;
              if (!["main", "develop"].includes(pr.base.ref)) continue;

              const age = now - new Date(pr.created_at).getTime();
              if (age < SLA_MS) continue;

              // Check whether any review or review-comment already exists.
              const [reviews, comments] = await Promise.all([
                github.rest.pulls.listReviews({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  pull_number: pr.number,
                }),
                github.rest.pulls.listReviewComments({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  pull_number: pr.number,
                }),
              ]);

              if (reviews.data.length > 0 || comments.data.length > 0) continue;

              // Check we haven't already posted this reminder (avoid spam).
              const { data: issueComments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: pr.number,
              });
              const alreadyPosted = issueComments.some(c =>
                c.body.includes("⏰ **Review SLA reminder**")
              );
              if (alreadyPosted) continue;

              const hoursOpen = Math.floor(age / (60 * 60 * 1000));
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: pr.number,
                body: [
                  `⏰ **Review SLA reminder** — this PR has been open for **${hoursOpen} h** with no review activity.`,
                  `Our SLA is a first response within **24 h** (CONTRIBUTING.md §5).`,
                  ``,
                  `Assigned code owner(s), please take a look or leave a comment if you need more time.`,
                ].join("\n"),
              });

              core.info(`Posted SLA reminder on PR #${pr.number} (${hoursOpen} h old)`);
            }
