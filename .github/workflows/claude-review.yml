name: Claude PR Review

# Automated Claude review on every PR (card O1.2 quality gate).
# Requires the repo secret ANTHROPIC_API_KEY (see CONTRIBUTING.md → "Repository secrets").
# Runs alongside CI; it comments/reviews but does not block merge on its own.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and skip if the API key isn't configured (e.g. forks).
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            Review this pull request for the AfriMentor AI microservices monorepo.
            Focus on, in priority order:
            1. Correctness & security: auth/JWT handling, no secrets or keys committed,
               input validation, SQL/injection risks, safe error handling.
            2. Service boundaries: changes respect ADR-0001 (database-per-service, events
               over cross-service calls, gateway is the only public ingress).
            3. API contracts: if an endpoint changed, the OpenAPI YAML in docs/api was
               regenerated (scripts/gen_openapi.py) and stays lint-clean.
            4. Tests: new behaviour has pytest coverage; ruff would pass.
            5. Docker: images stay lean (multi-stage, non-root, no test deps at runtime).
            Post concise, actionable inline comments. Praise is unnecessary; be specific
            about risks and suggest concrete fixes. Skip nitpicks already handled by ruff.
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
