name: CI

# Per-service lint → test → build → docker push (ADR-0001 §9, card O1.2).
# Runs on every PR and blocks merge on failure (see branch protection in CONTRIBUTING.md).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Discover which services changed so PRs only build what they touch.
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway: services/api-gateway/**
            auth-user-service: services/auth-user-service/**
            intake-profiling-service: services/intake-profiling-service/**
            chat-orchestration-service: services/chat-orchestration-service/**
            persona-prompt-service: services/persona-prompt-service/**
            rag-corpus-service: services/rag-corpus-service/**
            goals-milestones-service: services/goals-milestones-service/**
            progress-gamification-service: services/progress-gamification-service/**
            insight-library-service: services/insight-library-service/**
            feedback-service: services/feedback-service/**
            research-evaluation-service: services/research-evaluation-service/**
            voice-service: services/voice-service/**
            notification-service: services/notification-service/**

  service:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Test (pytest)
        run: pytest -q

      - name: Build Docker image
        run: docker build -t afrimentor/${{ matrix.service }}:${{ github.sha }} .

      # Push only on merge to main. Requires DOCKER_USERNAME/DOCKER_PASSWORD secrets;
      # skipped automatically on forks / when secrets are absent.
      - name: Log in to registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKER_USERNAME != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKER_USERNAME != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker push afrimentor/${{ matrix.service }}:${{ github.sha }}

  # Aggregate gate: a single required check for branch protection.
  ci-ok:
    needs: [changes, service]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs passed
        run: |
          if [ "${{ needs.service.result }}" = "failure" ] || [ "${{ needs.service.result }}" = "cancelled" ]; then
            echo "One or more service jobs failed."
            exit 1
          fi
          echo "CI passed."
