name: CI

# Per-service lint → test → build → docker push (ADR-0001 §9, card O1.2).
# Runs on every PR and blocks merge on failure (see branch protection in CONTRIBUTING.md).

on:
  push:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Discover which services changed so PRs only build what they touch.
  # On push to main/develop all services are built.
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: set
        run: |
          ALL='["api-gateway","auth-user-service","intake-profiling-service","chat-orchestration-service","persona-prompt-service","rag-corpus-service","goals-milestones-service","progress-gamification-service","insight-library-service","feedback-service","research-evaluation-service","voice-service","notification-service"]'
          if [ "${{ github.base_ref }}" = "develop" ] || [ "${{ github.base_ref }}" = "main" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^services/' | cut -d/ -f2 | sort -u)
            if [ -z "$CHANGED" ]; then
              echo "services=[]" >> "$GITHUB_OUTPUT"
            else
              JSON=$(echo "$CHANGED" | jq -Rsc '[split("\n")[] | select(length>0)]')
              echo "services=$JSON" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ] && [ "${{ github.ref }}" != "refs/heads/develop" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^services/' | cut -d/ -f2 | sort -u)
            if [ -z "$CHANGED" ]; then
              echo "services=[]" >> "$GITHUB_OUTPUT"
            else
              JSON=$(echo "$CHANGED" | jq -Rsc '[split("\n")[] | select(length>0)]')
              echo "services=$JSON" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "services=$ALL" >> "$GITHUB_OUTPUT"
          fi

  service:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check app tests --config ../../pyproject.toml --fix

      - name: Test (pytest)
        run: pytest -q

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }} .

      # Push only on merge to main. Requires DOCKER_USERNAME/DOCKER_PASSWORD secrets;
      # skipped automatically on forks / when secrets are absent.
      - name: Log in to registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKER_USERNAME != ''
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}

  # Validate the Compose project(s) so an invalid stack — e.g. an always-on service
  # depending on a profile-gated (undefined) service — fails here rather than at
  # `docker compose build`. `config -q` resolves and validates without building.
  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate dev stack (default profile)
        run: docker compose -f docker-compose.yml config -q

      - name: Validate dev stack (chat profile)
        run: docker compose -f docker-compose.yml --profile chat config -q

      # Overlay inherits the base's services/dependencies; GF admin password is a
      # required interpolation, so supply a throwaway value just for validation.
      - name: Validate staging overlay
        env:
          GF_SECURITY_ADMIN_PASSWORD: ci-validate
        run: docker compose -f docker-compose.yml -f docker-compose.staging.yml config -q

  # Aggregate gate: a single required check for branch protection.
  ci-ok:
    needs: [changes, service, compose-validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs passed
        run: |
          if [ "${{ needs.service.result }}" = "failure" ] || [ "${{ needs.service.result }}" = "cancelled" ]; then
            echo "One or more service jobs failed."
            exit 1
          fi
          if [ "${{ needs.compose-validate.result }}" != "success" ]; then
            echo "Compose validation failed."
            exit 1
          fi
          echo "CI passed."
