openapi: 3.1.0
info:
  title: "AfriMentor AI \u2014 Voice Service"
  version: 1.0.0
  description: Speech-to-text and text-to-speech for the mentor chat.
servers:
- url: http://localhost:8000
  description: via API gateway
- url: http://localhost:8011
  description: voice-service direct (dev)
security:
- bearerAuth: []
tags:
- name: voice
- name: meta
paths:
  /health:
    get:
      tags:
      - meta
      summary: Liveness/readiness probe
      security: []
      responses:
        '200':
          description: healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/voice/transcribe:
    post:
      tags:
      - voice
      summary: Transcribe uploaded audio
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/v1/voice/synthesize:
    post:
      tags:
      - voice
      summary: Synthesize speech from text
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
        version:
          type: string
      required:
      - status
      - service
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
