openapi: 3.1.0
info:
  title: "AfriMentor AI \u2014 Notification Service"
  version: 1.0.0
  description: Push/in-app/email notifications. Reacts to domain events.
servers:
- url: http://localhost:8000
  description: via API gateway
- url: http://localhost:8012
  description: notification-service direct (dev)
security:
- bearerAuth: []
tags:
- name: notifications
- name: meta
paths:
  /health:
    get:
      tags:
      - meta
      summary: Liveness/readiness probe
      security: []
      responses:
        '200':
          description: healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/notifications:
    get:
      tags:
      - notifications
      summary: List notifications
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
  /api/v1/notifications/{id}/read:
    post:
      tags:
      - notifications
      summary: Mark as read
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/v1/notifications/read-all:
    post:
      tags:
      - notifications
      summary: Mark all as read
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
        version:
          type: string
      required:
      - status
      - service
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
