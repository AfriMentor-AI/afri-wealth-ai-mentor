openapi: 3.1.0
info:
  title: "AfriMentor AI \u2014 Feedback Service"
  version: 1.0.0
  description: Post-session surveys, thumbs, and free-text feedback capture.
servers:
- url: http://localhost:8000
  description: via API gateway
- url: http://localhost:8009
  description: feedback-service direct (dev)
security:
- bearerAuth: []
tags:
- name: feedback
- name: meta
paths:
  /health:
    get:
      tags:
      - meta
      summary: Liveness/readiness probe
      security: []
      responses:
        '200':
          description: healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/feedback:
    post:
      tags:
      - feedback
      summary: Submit feedback
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/v1/feedback/surveys/{id}:
    get:
      tags:
      - feedback
      summary: Get a survey definition
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
        version:
          type: string
      required:
      - status
      - service
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
