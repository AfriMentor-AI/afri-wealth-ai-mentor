openapi: 3.1.0
info:
  title: "AfriMentor AI \u2014 Insight Library Service"
  version: 1.0.0
  description: Curated insight articles/cards, categories and bookmarks.
servers:
- url: http://localhost:8000
  description: via API gateway
- url: http://localhost:8008
  description: insight-library-service direct (dev)
security:
- bearerAuth: []
tags:
- name: insights
- name: meta
paths:
  /health:
    get:
      tags:
      - meta
      summary: Liveness/readiness probe
      security: []
      responses:
        '200':
          description: healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/insights:
    get:
      tags:
      - insights
      summary: List insights
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
  /api/v1/insights/{id}:
    get:
      tags:
      - insights
      summary: Get an insight
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
      parameters: &id001
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/v1/insights/{id}/bookmark:
    post:
      tags:
      - insights
      summary: Bookmark an insight
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
      parameters: *id001
  /api/v1/insights/bookmarks:
    get:
      tags:
      - insights
      summary: List bookmarks
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
        version:
          type: string
      required:
      - status
      - service
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
