# Llama-3.1-8B-Instruct (gated on HF: accept Meta's licence for the account whose HF_TOKEN Kaggle uses). Matches the Llama deployed via OpenRouter.
# Generated from the Qwen configs for the papers-revision retrain; dataset = splits_v2 (synthetic, see datasets/scripts/generate_dataset.py).
# Sequences are ~2k tokens (the persona system prompt alone is ~1.7k): batch 1 x accum 16, and run with
# CUDA_VISIBLE_DEVICES=0 so gradient checkpointing works (it breaks when the model is sharded over 2 GPUs).
experiment:
  name: C2_supervised_persona_finetuning_llama31-8b_v2
  condition_id: C2
  sprint: 4
model:
  base_model_id: meta-llama/Llama-3.1-8B-Instruct
  adapter_type: qlora
  output_dir: research/experiments/02_supervised_finetuning/checkpoints_llama31-8b
  hub_repo: AfriMentor/chioma-llama31-8b-sft-v2
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
  - q_proj
  - v_proj
  - k_proj
  - o_proj
  bias: none
  task_type: CAUSAL_LM
quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: float16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
training:
  dataset: research/datasets/splits_v2/sft_train.jsonl
  eval_dataset: research/datasets/splits_v2/sft_val.jsonl
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  max_seq_length: 2560
  fp16: true
  bf16: false
  logging_steps: 10
  eval_steps: 50
  save_steps: 100
  save_total_limit: 3
  seed: 42
evaluation:
  metrics:
  - persona_adherence
  - cultural_fluency
  - anti_dependency
  - financial_accuracy
  - urgency
  - rouge_l
  - bert_score_f1
  compare_against: C1_baseline_prompting
  max_new_tokens: 512
mlflow:
  experiment_name: C2_supervised_persona_finetuning_llama31-8b_v2
  run_name_prefix: c2
  log_artifacts: true
  log_model: true
