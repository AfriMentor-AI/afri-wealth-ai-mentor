# research/configs/c2_supervised_finetuning.yaml
# Condition C2: Supervised Persona Fine-Tuning — QLoRA on Chioma conversation demos.

experiment:
  name: "C2_supervised_persona_finetuning"
  condition_id: "C2"
  sprint: 4

model:
  base_model_id: "Qwen/Qwen2.5-7B-Instruct"  # HuggingFace model ID
  adapter_type: "qlora"
  output_dir: "research/experiments/02_supervised_finetuning/checkpoints"
  hub_repo: "afrimentor/chioma-sft-v1"        # HuggingFace Hub publish target

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

training:
  dataset: "research/datasets/splits/sft_train.jsonl"
  eval_dataset: "research/datasets/splits/sft_val.jsonl"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4           # effective batch = 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  max_seq_length: 2048
  fp16: false
  bf16: true
  logging_steps: 10
  eval_steps: 50
  save_steps: 100
  save_total_limit: 3

evaluation:
  metrics:
    - persona_adherence
    - cultural_fluency
    - anti_dependency
    - financial_accuracy
    - urgency
    - rouge_l
    - bert_score_f1
  compare_against: "C1_baseline_prompting"  # baseline experiment to diff against

mlflow:
  experiment_name: "C2_supervised_persona_finetuning"
  run_name_prefix: "c2"
  log_artifacts: true
  log_model: true
