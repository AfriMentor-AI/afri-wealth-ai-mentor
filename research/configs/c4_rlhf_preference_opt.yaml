# research/configs/c4_rlhf_preference_opt.yaml
# Condition C4: RLHF / Preference Optimization — reward probe + personality-focused DPO.
#
# Pipeline (3 stages):
#   Stage 1 (reward_model): Score preference pairs with LLM-as-judge, fit a logistic
#     probe on per-dimension score deltas, evaluate on held-out val split.
#   Stage 2 (dpo): Convert probe-ranked pairs to DPO format, warm-start from the
#     best prior checkpoint (C3 DPO adapter or base model), run TRL DPO.
#   Stage 3 (evaluate): Score the trained checkpoint against the shared metric suite
#     (same keys as C1/C2/C3) and log to MLflow.
#
# Usage (no GPU — reward probe + eval only):
#   python research/experiments/04_rlhf_preference_opt/run.py --stage all
#
# Usage (GPU node — full pipeline including DPO fine-tuning):
#   python research/experiments/04_rlhf_preference_opt/run.py --stage all

experiment:
  name: "C4_rlhf_preference_optimization"
  condition_id: "C4"
  sprint: 5

model:
  base_model_id: "Qwen/Qwen2.5-7B-Instruct"
  # Warm-start from the C3 DPO checkpoint if available; otherwise uses base model.
  prior_checkpoint: "research/experiments/03_contrastive_learning/checkpoints/final"
  output_dir: "research/experiments/04_rlhf_preference_opt/checkpoints"
  hub_repo: "afrimentor/chioma-rlhf-v1"

reward_model:
  # Preference datasets — expanded to 50/12/10 pairs in this sprint.
  dataset: "research/datasets/splits/rlhf_train.jsonl"
  eval_dataset: "research/datasets/splits/rlhf_val.jsonl"
  test_dataset: "research/datasets/splits/rlhf_test.jsonl"
  # Output path for the serialised sklearn logistic probe.
  probe_output: "research/experiments/04_rlhf_preference_opt/reward_model/reward_probe.pkl"
  # Automatic persona-consistency metrics integration (Abdulhai et al. 2025)
  include_consistency: true
  # Per-dimension weights used to compute scalar reward from LLM-judge scores.
  reward_weights:
    persona_adherence: 0.20
    cultural_fluency: 0.15
    anti_dependency: 0.15
    financial_accuracy: 0.15
    urgency: 0.15
    prompt_to_line: 0.08
    line_to_line: 0.06
    qa_consistency: 0.06

ablation:
  enabled: true
  conditions:
    without_consistency:
      name: "reward_without_consistency"
      include_consistency: false
      reward_weights:
        persona_adherence: 0.25
        cultural_fluency: 0.20
        anti_dependency: 0.20
        financial_accuracy: 0.20
        urgency: 0.15
    with_consistency:
      name: "reward_with_consistency"
      include_consistency: true
      reward_weights:
        persona_adherence: 0.20
        cultural_fluency: 0.15
        anti_dependency: 0.15
        financial_accuracy: 0.15
        urgency: 0.15
        prompt_to_line: 0.08
        line_to_line: 0.06
        qa_consistency: 0.06

dpo:
  # Probe-guided DPO — pairs are re-ranked by the reward probe before DPO training.
  beta: 0.1                         # KL penalty coefficient (same as C3 for comparability)
  loss_type: "sigmoid"              # sigmoid | hinge | ipo
  max_length: 2048
  max_prompt_length: 512
  # Dataset for DPO training (converted from rlhf_train.jsonl by the runner)
  converted_dataset: "research/experiments/04_rlhf_preference_opt/checkpoints/dpo_converted_train.jsonl"
  converted_eval_dataset: "research/experiments/04_rlhf_preference_opt/checkpoints/dpo_converted_val.jsonl"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

training:
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8     # effective batch = 16
  learning_rate: 5.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  bf16: true
  logging_steps: 10
  eval_steps: 50
  save_steps: 100
  save_total_limit: 3

evaluation:
  # Post-training scoring against the SHARED metric suite — same keys as C1/C2/C3.
  sample_size: 6
  eval_split: "sft_test.jsonl"
  max_new_tokens: 512
  temperature: 0.0           # greedy — comparison baseline must not carry sampling noise
  metrics:
    - persona_adherence
    - cultural_fluency
    - anti_dependency
    - financial_accuracy
    - urgency
    - rouge_l
    - bert_score_f1
  compare_against: "C3_persona_contrastive_learning"

mlflow:
  experiment_name: "C4_rlhf_preference_optimization"
  run_name_prefix: "c4"
  log_artifacts: true
  log_model: false          # only log on GPU node when actual adapter is produced
