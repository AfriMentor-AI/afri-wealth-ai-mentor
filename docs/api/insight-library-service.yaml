openapi: 3.1.0
info:
  title: "AfriMentor AI — Insight Library Service"
  version: 1.0.0
  description: >
    Curated insight articles/audio (card O3.2): catalog, search/filter, and
    per-user favorites/bookmarks.
servers:
- url: http://localhost:8000
  description: via API gateway
- url: http://localhost:8008
  description: insight-library-service direct (dev)
security:
- bearerAuth: []
tags:
- name: insights
- name: meta
paths:
  /health:
    get:
      tags: [meta]
      summary: Liveness/readiness probe
      security: []
      responses:
        '200':
          description: healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /api/v1/insights:
    get:
      tags: [insights]
      summary: List insights
      parameters:
      - name: search
        in: query
        schema: { type: string }
        description: Matches title or summary (case-insensitive substring).
      - name: category
        in: query
        schema: { type: string }
      - name: is_audio
        in: query
        schema: { type: boolean }
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InsightItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [insights]
      summary: Create a catalog entry (admin role required)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsightItemCreate' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsightItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: admin role required }
  /api/v1/insights/{id}:
    get:
      tags: [insights]
      summary: Get an insight
      parameters: &id001
      - name: id
        in: path
        required: true
        schema: { type: string }
      responses:
        '200':
          description: success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsightItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: not found }
  /api/v1/insights/{id}/bookmark:
    post:
      tags: [insights]
      summary: Bookmark an insight (idempotent)
      responses:
        '204': { description: bookmarked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: not found }
      parameters: *id001
    delete:
      tags: [insights]
      summary: Remove a bookmark (idempotent)
      responses:
        '204': { description: removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
      parameters: *id001
  /api/v1/insights/bookmarks:
    get:
      tags: [insights]
      summary: List the current user's bookmarked insights
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InsightItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, example: healthy }
        service: { type: string }
        version: { type: string }
      required: [status, service]
    Error:
      type: object
      properties:
        detail: { type: string }
      required: [detail]
    InsightItemCreate:
      type: object
      properties:
        title: { type: string }
        summary: { type: string }
        category: { type: string }
        duration_minutes: { type: integer }
        is_audio: { type: boolean, default: false }
        media_url: { type: string, nullable: true }
      required: [title, summary, category, duration_minutes]
    InsightItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        category: { type: string }
        duration_minutes: { type: integer }
        is_audio: { type: boolean }
        media_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        is_favorited: { type: boolean }
      required: [id, title, summary, category, duration_minutes, is_audio, created_at, is_favorited]
