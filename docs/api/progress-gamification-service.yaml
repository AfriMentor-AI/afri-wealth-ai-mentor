openapi: 3.1.0
info:
  title: "AfriMentor AI — Progress & Gamification Service"
  version: 1.0.0
  description: >
    Streaks, action heatmap, and badge/achievement logic (card O3.1). Reacts to
    activity recorded via POST /api/v1/progress/actions and emits `badge.earned`.
servers:
- url: http://localhost:8000
  description: via API gateway
- url: http://localhost:8007
  description: progress-gamification-service direct (dev)
security:
- bearerAuth: []
tags:
- name: progress
- name: meta
paths:
  /health:
    get:
      tags: [meta]
      summary: Liveness/readiness probe
      security: []
      responses:
        '200':
          description: healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /api/v1/progress:
    get:
      tags: [progress]
      summary: Get the user's progress summary (streak + heatmap + badges)
      responses:
        '200':
          description: success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/progress/streak:
    get:
      tags: [progress]
      summary: Get current streak
      responses:
        '200':
          description: success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreakStat' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/progress/badges:
    get:
      tags: [progress]
      summary: List badge catalog with earned/locked status
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BadgeWithStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/progress/actions:
    post:
      tags: [progress]
      summary: Record one completed action for a day
      description: >
        Recording the same (day, kind) twice is a no-op, not an error. Recomputes
        the streak and re-evaluates badge triggers, awarding any newly-earned ones.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionCreate' }
      responses:
        '201':
          description: recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionRecordResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/progress/summary/share:
    post:
      tags: [progress]
      summary: Build a shareable weekly-summary payload
      responses:
        '200':
          description: success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklySummaryShare' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, example: healthy }
        service: { type: string }
        version: { type: string }
      required: [status, service]
    Error:
      type: object
      properties:
        detail: { type: string }
      required: [detail]
    ActionKind:
      type: string
      enum: [daily_action, insight_completed, savings_goal_met]
    ActionCreate:
      type: object
      properties:
        kind: { $ref: '#/components/schemas/ActionKind' }
        occurred_on:
          type: string
          format: date
          description: Defaults to today (server clock) when omitted.
      required: [kind]
    StreakStat:
      type: object
      properties:
        user_id: { type: string }
        current_streak_days: { type: integer }
        longest_streak_days: { type: integer }
        actions_completed_total: { type: integer }
        updated_at: { type: string, format: date-time }
      required: [user_id, current_streak_days, longest_streak_days, actions_completed_total, updated_at]
    BadgeAward:
      type: object
      properties:
        badge_id: { type: string }
        label: { type: string }
      required: [badge_id, label]
    ActionRecordResponse:
      type: object
      properties:
        streak: { $ref: '#/components/schemas/StreakStat' }
        newly_earned_badges:
          type: array
          items: { $ref: '#/components/schemas/BadgeAward' }
      required: [streak, newly_earned_badges]
    HeatmapDay:
      type: object
      properties:
        date: { type: string, format: date }
        count: { type: integer }
      required: [date, count]
    BadgeWithStatus:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        icon_name: { type: string }
        earned_at: { type: string, format: date-time, nullable: true }
      required: [id, label, description, icon_name, earned_at]
    ProgressSummary:
      type: object
      properties:
        streak: { $ref: '#/components/schemas/StreakStat' }
        heatmap:
          type: array
          items: { $ref: '#/components/schemas/HeatmapDay' }
        badges:
          type: array
          items: { $ref: '#/components/schemas/BadgeWithStatus' }
      required: [streak, heatmap, badges]
    WeeklySummaryShare:
      type: object
      properties:
        user_id: { type: string }
        week_start: { type: string, format: date }
        week_end: { type: string, format: date }
        actions_this_week: { type: integer }
        current_streak_days: { type: integer }
        badges_earned_this_week:
          type: array
          items: { type: string }
        share_text: { type: string }
      required: [user_id, week_start, week_end, actions_this_week, current_streak_days, badges_earned_this_week, share_text]
