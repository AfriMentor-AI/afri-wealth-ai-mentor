openapi: 3.1.0
info:
  title: "AfriMentor AI \u2014 Persona & Prompt Service"
  version: 1.0.0
  description: Persona catalogue, archetype selection, and system-prompt templating.
servers:
- url: http://localhost:8000
  description: via API gateway
- url: http://localhost:8004
  description: persona-prompt-service direct (dev)
security:
- bearerAuth: []
tags:
- name: personas
- name: meta
paths:
  /health:
    get:
      tags:
      - meta
      summary: Liveness/readiness probe
      security: []
      responses:
        '200':
          description: healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/personas:
    get:
      tags:
      - personas
      summary: List personas
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
  /api/v1/personas/{id}:
    get:
      tags:
      - personas
      summary: Get a persona
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/v1/personas/select:
    post:
      tags:
      - personas
      summary: Select a persona for a user
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /personas/chioma:
    get:
      tags:
      - personas
      summary: Get the CHIOMA persona profile spec
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
  /personas/chioma/prompt:
    get:
      tags:
      - personas
      summary: Render the CHIOMA system prompt
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
        version:
          type: string
      required:
      - status
      - service
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
