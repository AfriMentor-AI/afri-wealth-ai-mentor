<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AfriMentor AI — API Docs</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --gold: #c8922a; --cream: #fcf9f3; --ink: #1c1c18; --outline: #d4c4b0; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--cream); color: var(--ink); }
    header {
      position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px;
      padding: 12px 20px; background: var(--cream); border-bottom: 1px solid var(--outline);
    }
    header h1 { font-family: "Be Vietnam Pro", sans-serif; font-size: 20px; margin: 0; color: var(--gold); }
    header .sub { font-size: 13px; opacity: 0.65; }
    label { font-size: 13px; font-weight: 600; }
    select {
      font: inherit; padding: 8px 12px; border-radius: 9999px; border: 1px solid var(--outline);
      background: #fff; color: var(--ink); min-width: 260px;
    }
    #redoc { min-height: calc(100vh - 58px); }
  </style>
</head>
<body>
  <header>
    <h1>AfriMentor AI</h1>
    <span class="sub">API Documentation</span>
    <div style="margin-left:auto; display:flex; align-items:center; gap:8px;">
      <label for="svc">Service</label>
      <select id="svc"></select>
    </div>
  </header>
  <div id="redoc"></div>

  <script src="https://cdn.redocly.com/redoc/latest/bundles/redoc.standalone.js"></script>
  <script>
    // Keep in sync with docs/api/*.yaml (generated by scripts/gen_openapi.py).
    const SERVICES = [
      "api-gateway", "auth-user-service", "intake-profiling-service",
      "chat-orchestration-service", "persona-prompt-service", "rag-corpus-service",
      "goals-milestones-service", "progress-gamification-service", "insight-library-service",
      "feedback-service", "research-evaluation-service", "voice-service", "notification-service",
    ];
    const select = document.getElementById("svc");
    for (const s of SERVICES) {
      const opt = document.createElement("option");
      opt.value = s; opt.textContent = s;
      select.appendChild(opt);
    }
    const options = { theme: { colors: { primary: { main: "#c8922a" } },
      typography: { fontFamily: "Inter, sans-serif", headings: { fontFamily: "Be Vietnam Pro, sans-serif" } } } };
    function render(service) {
      Redoc.init(`./${service}.yaml`, options, document.getElementById("redoc"));
      location.hash = service;
    }
    select.addEventListener("change", (e) => render(e.target.value));
    const initial = SERVICES.includes(location.hash.slice(1)) ? location.hash.slice(1) : SERVICES[0];
    select.value = initial;
    render(initial);
  </script>
</body>
</html>
