openapi: 3.1.0
info:
  title: "AfriMentor AI \u2014 RAG Corpus Service"
  version: 1.0.0
  description: Corpus ingestion, chunking, embedding, and vector retrieval (ChromaDB).
servers:
- url: http://localhost:8000
  description: via API gateway
- url: http://localhost:8005
  description: rag-corpus-service direct (dev)
security:
- bearerAuth: []
tags:
- name: rag
- name: meta
paths:
  /health:
    get:
      tags:
      - meta
      summary: Liveness/readiness probe
      security: []
      responses:
        '200':
          description: healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/rag/documents:
    post:
      tags:
      - rag
      summary: Ingest a document
      responses:
        '201':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
    get:
      tags:
      - rag
      summary: List documents
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
  /api/v1/rag/documents/export.csv:
    get:
      tags:
      - rag
      summary: Export the document catalogue as CSV
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
  /api/v1/rag/documents/{id}:
    delete:
      tags:
      - rag
      summary: Delete a document
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/v1/rag/stats:
    get:
      tags:
      - rag
      summary: Corpus index-health statistics
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
  /api/v1/rag/query:
    post:
      tags:
      - rag
      summary: Retrieve relevant chunks
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'TODO: request/response bodies finalised in later sprint.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
        version:
          type: string
      required:
      - status
      - service
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
