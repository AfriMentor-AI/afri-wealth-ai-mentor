# Remote development stack.
# Keeps the backend, datastores, research, and observability on the remote host.
# The service definitions are inherited from docker-compose.yml, which remains unchanged.
name: afrimentor-remote

x-remote-env: &remote-env
  env_file:
    - ./docker-compose.remote.env

services:
  postgres:
    extends:
      file: ./docker-compose.yml
      service: postgres
    <<: *remote-env
  redis:
    extends:
      file: ./docker-compose.yml
      service: redis
    <<: *remote-env
  rabbitmq:
    extends:
      file: ./docker-compose.yml
      service: rabbitmq
    <<: *remote-env
  chromadb:
    extends:
      file: ./docker-compose.yml
      service: chromadb
    <<: *remote-env
  mlflow:
    extends:
      file: ./docker-compose.yml
      service: mlflow
    <<: *remote-env
  api-gateway:
    extends:
      file: ./docker-compose.yml
      service: api-gateway
    <<: *remote-env
  auth-user-service:
    extends:
      file: ./docker-compose.yml
      service: auth-user-service
    <<: *remote-env
  intake-profiling-service:
    extends:
      file: ./docker-compose.yml
      service: intake-profiling-service
    <<: *remote-env
  chat-orchestration-service:
    extends:
      file: ./docker-compose.yml
      service: chat-orchestration-service
    <<: *remote-env
  persona-prompt-service:
    extends:
      file: ./docker-compose.yml
      service: persona-prompt-service
    <<: *remote-env
  rag-corpus-service:
    extends:
      file: ./docker-compose.yml
      service: rag-corpus-service
    <<: *remote-env
  goals-milestones-service:
    extends:
      file: ./docker-compose.yml
      service: goals-milestones-service
    <<: *remote-env
  progress-gamification-service:
    extends:
      file: ./docker-compose.yml
      service: progress-gamification-service
    <<: *remote-env
  insight-library-service:
    extends:
      file: ./docker-compose.yml
      service: insight-library-service
    <<: *remote-env
  feedback-service:
    extends:
      file: ./docker-compose.yml
      service: feedback-service
    <<: *remote-env
  research-evaluation-service:
    extends:
      file: ./docker-compose.yml
      service: research-evaluation-service
    <<: *remote-env
  voice-service:
    extends:
      file: ./docker-compose.yml
      service: voice-service
    <<: *remote-env
  notification-service:
    extends:
      file: ./docker-compose.yml
      service: notification-service
    <<: *remote-env
  prometheus:
    extends:
      file: ./docker-compose.yml
      service: prometheus
    <<: *remote-env
  loki:
    extends:
      file: ./docker-compose.yml
      service: loki
    <<: *remote-env
  promtail:
    extends:
      file: ./docker-compose.yml
      service: promtail
    <<: *remote-env
  grafana:
    extends:
      file: ./docker-compose.yml
      service: grafana
    <<: *remote-env
  jaeger:
    extends:
      file: ./docker-compose.yml
      service: jaeger
    <<: *remote-env

networks:
  afrimentor:
    driver: bridge

volumes:
  pgdata:
  rabbitdata:
  chromadata:
  voicedata:
  mlflowdata:
  promdata:
  lokidata:
  grafanadata:
